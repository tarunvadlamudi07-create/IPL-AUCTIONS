const POOL=RAW.trim().split('\n').map(l=>{const [n,r,c,b,t]=l.split('|');return{n,r,c,b:+b,t}});
const TEAMS={CSK:'Chennai Super Kings',MI:'Mumbai Indians',RCB:'Royal Challengers Bengaluru',KKR:'Kolkata Knight Riders',SRH:'Sunrisers Hyderabad',DC:'Delhi Capitals',PBKS:'Punjab Kings',RR:'Rajasthan Royals',GT:'Gujarat Titans',LSG:'Lucknow Super Giants'};

/* ---------- helpers ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const cr=l=>(l/100).toFixed(l%100?2:0).replace(/(\.\d)0$/,'$1')+' Cr';
const inc=l=>l<100?5:l<200?10:l<500?20:25;
function can(T,p,price){if(!T)return false;if(T.squad.length>=25)return false;if(p.c!=='IND'&&T.os>=8)return false;
  return T.purse-price>=Math.max(0,17-T.squad.length)*30}

let tok=localStorage.iplTok||(localStorage.iplTok=Math.random().toString(36).slice(2)+Date.now().toString(36));
let name=localStorage.iplName||'',isHost=false,peer,hostConn,conns={},S,V=null,you=null,recv=0,room=location.hash.slice(1),err='';

/* ---------- extra styles + pool overlay container (host only) ---------- */
const st=document.createElement('style');
st.textContent=`#poolbox{position:fixed;inset:0;background:rgba(5,8,25,.94);z-index:50;overflow:auto;padding:12px;display:none}
#poolbox.on{display:block}.pw{max-width:980px;margin:auto}
.pw select,.pw input{padding:8px;border-radius:8px;border:0;margin:3px 6px 3px 0;width:auto}
.pw .x{color:#ff8080;cursor:pointer;background:none;border:0;font-size:13px}.tw{overflow-x:auto}`;
document.head.appendChild(st);
const pb=document.createElement('div');pb.id='poolbox';document.body.appendChild(pb);
let poolOpen=false,psig='',pf={q:'',r:'',c:'',s:''};

/* ---------- HOST (authoritative auctioneer) ---------- */
function newS(){const teams={};for(const k in TEAMS)teams[k]={owner:null,purse:0,squad:[],os:0,rtm:0};
  return{phase:'lobby',cfg:{purse:12000,rtm:2},players:{},teams,pool:[],i:0,cur:null,log:[],round:1,unsold:[],excl:{},hostTok:tok}}

function view(){const names={};for(const k in S.players)names[k]=S.players[k].name;const teams={};
  for(const k in S.teams){const T=S.teams[k];teams[k]={...T,owner:T.owner?names[T.owner]:null}}
  return{phase:S.phase,cfg:S.cfg,teams,i:S.i,n:S.pool.length,round:S.round,log:S.log.slice(0,30),
    poolN:POOL.length-Object.keys(S.excl).length,
    people:Object.values(S.players).map(p=>({name:p.name,team:p.team})),
    cur:S.cur&&{...S.cur,left:Math.max(0,S.cur.end-Date.now())}}}
function bc(){const v=view();for(const k in conns){try{conns[k].send({t:'s',s:v,you:S.players[k]&&S.players[k].team})}catch(e){}}
  V=v;you=S.players[tok]&&S.players[tok].team;recv=Date.now();render();
  if(poolOpen){const sg=S.log.length+'|'+S.i+'|'+S.phase+'|'+Object.keys(S.excl).length+'|'+(S.cur?S.cur.p.n:'');
    if(sg!==psig&&!(document.activeElement&&document.activeElement.id==='pq')){psig=sg;renderPool()}}}

function handle(k,m){
  const pl=S.players[k];
  if(m.t==='join'){S.players[k]={name:String(m.name||'Guest').slice(0,20),team:pl?pl.team:null};bc();return}
  if(!pl)return;
  if(m.t==='pick'&&S.phase==='lobby'&&S.teams[m.team]){const T=S.teams[m.team];
    if(!T.owner||T.owner===k){if(pl.team===m.team){T.owner=null;pl.team=null}
      else{if(pl.team)S.teams[pl.team].owner=null;T.owner=k;pl.team=m.team}}}
  else if(m.t==='cfg'&&k===S.hostTok&&S.phase==='lobby'){
    S.cfg={purse:Math.max(2000,Math.min(30000,Math.round(+m.purse*100)||12000)),rtm:Math.max(0,Math.min(6,+m.rtm||0))}}
  else if(m.t==='excl'&&k===S.hostTok&&S.phase==='lobby'){const p=POOL[m.i];
    if(p){if(S.excl[p.n])delete S.excl[p.n];else S.excl[p.n]=1}}
  else if(m.t==='start'&&k===S.hostTok&&S.phase==='lobby')start();
  else if(m.t==='bid')bid(pl.team);
  else if(m.t==='rtm')rtmAns(pl.team,!!m.yes);
  else if(m.t==='raise')raiseAns(pl.team,!!m.yes);
  bc();
}
function start(){
  if(Object.values(S.teams).filter(t=>t.owner).length<2)return;
  const live=POOL.filter(p=>!S.excl[p.n]);if(live.length<10)return;
  for(const k in S.teams){const T=S.teams[k];T.purse=S.cfg.purse;T.rtm=S.cfg.rtm;T.squad=[];T.os=0}
  const m=live.filter(p=>p.b>=200),r=live.filter(p=>p.b<200);
  S.pool=[...shuffle(m),...['WK','BAT','AR','BWL'].flatMap(x=>shuffle(r.filter(p=>p.r===x)))];
  S.phase='auction';S.i=0;S.round=1;S.unsold=[];S.log=[];open()}
function open(){S.cur={p:S.pool[S.i],bid:0,bidder:null,end:Date.now()+25000,stage:'bid',hist:[]}}
function next(){S.i++;
  if(S.i>=S.pool.length){
    if(S.round===1&&S.unsold.length){S.round=2;S.pool=shuffle(S.unsold);S.unsold=[];S.i=0}
    else{S.phase='done';S.cur=null;return}}
  open()}
function bid(team){const c=S.cur;if(!c||c.stage!=='bid'||!team||c.bidder===team)return;
  const T=S.teams[team],nb=c.bidder?c.bid+inc(c.bid):c.p.b;if(!can(T,c.p,nb))return;
  c.bid=nb;c.bidder=team;c.end=Math.max(c.end,Date.now()+10000);c.hist.unshift(team+' '+cr(nb))}
function sell(team,price,rtm){const c=S.cur,T=S.teams[team];T.purse-=price;T.squad.push({...c.p,price,rtm:!!rtm});
  if(c.p.c!=='IND')T.os++;if(rtm)T.rtm--;c.stage='result';c.sold=team;
  c.msg='SOLD to '+team+' for '+cr(price)+(rtm?' (RTM)':'');c.end=Date.now()+4000;
  S.log.unshift(c.p.n+' → '+team+' '+cr(price)+(rtm?' (RTM)':''))}
function rtmAns(team,yes){const c=S.cur;if(!c||team!==c.rtm)return;
  if(c.stage==='rtm'){if(yes){c.stage='raise';c.end=Date.now()+15000;c.hist.unshift(team+' uses RTM at '+cr(c.bid))}else sell(c.bidder,c.bid)}
  else if(c.stage==='rtm2'){if(yes)sell(team,c.bid,true);else sell(c.bidder,c.bid)}}
function raiseAns(team,yes){const c=S.cur;if(!c||c.stage!=='raise'||team!==c.bidder)return;
  if(yes){const nb=c.bid+inc(c.bid);
    if(can(S.teams[c.bidder],c.p,nb)){c.bid=nb;c.hist.unshift(team+' raises to '+cr(nb));
      if(can(S.teams[c.rtm],c.p,nb)){c.stage='rtm2';c.end=Date.now()+15000}else sell(c.bidder,c.bid)}
    else sell(c.rtm,c.bid,true)}
  else sell(c.rtm,c.bid,true)}
function tick(){if(!S||S.phase!=='auction')return;const c=S.cur,now=Date.now();if(now<c.end)return;
  if(c.stage==='bid'){
    if(!c.bidder){S.unsold.push(c.p);c.stage='result';c.msg='UNSOLD';c.end=now+3000;S.log.unshift(c.p.n+' → unsold')}
    else{const T=S.teams[c.p.t];
      if(T&&T.owner&&c.p.t!==c.bidder&&T.rtm>0&&can(T,c.p,c.bid)){c.stage='rtm';c.rtm=c.p.t;c.end=now+15000}
      else sell(c.bidder,c.bid)}}
  else if(c.stage==='rtm'||c.stage==='rtm2')rtmAns(c.rtm,false);
  else if(c.stage==='raise')raiseAns(c.bidder,false);
  else if(c.stage==='result')next();
  bc()}

/* ---------- HOST POOL VIEWER ---------- */
function statusOf(p){
  for(const k in S.teams){const x=S.teams[k].squad.find(q=>q.n===p.n);if(x)return{s:'Sold',d:k+' · '+cr(x.price)+(x.rtm?' (RTM)':'')}}
  if(S.excl[p.n])return{s:'Removed',d:''};
  if(S.phase==='lobby')return{s:'In pool',d:''};
  if(S.phase==='auction'&&S.cur&&S.cur.p.n===p.n)return{s:'Live',d:'on the block now'};
  if(S.unsold.some(q=>q.n===p.n))return{s:'Unsold',d:S.round===1?'returns in accelerated round':'final'};
  const i=S.pool.findIndex(q=>q.n===p.n);
  if(i>S.i)return{s:'Upcoming',d:'lot '+(i+1)};
  return{s:'Unsold',d:''}}
function openPool(){poolOpen=true;renderPool()}
function closePool(){poolOpen=false;renderPool()}

/* ---------- networking ---------- */
function send(m){m.tok=tok;if(isHost)handle(tok,m);else if(hostConn&&hostConn.open)hostConn.send(m)}
function create(){name=$('#nm').value.trim();if(!name)return;localStorage.iplName=name;isHost=true;
  const id='ipl'+Math.random().toString(36).slice(2,7);peer=new Peer(id);
  peer.on('open',()=>{room=id;S=newS();S.players[tok]={name,team:null};
    peer.on('connection',c=>{c.on('data',m=>{if(!m||!m.tok)return;conns[m.tok]=c;handle(m.tok,m)});
      c.on('close',()=>{for(const k in conns)if(conns[k]===c)delete conns[k]})});
    setInterval(tick,500);setInterval(()=>{if(S.phase==='auction')bc()},3000);bc()});
  peer.on('error',e=>{err='Connection error: '+e.type;render()})}
function join(){name=$('#nm').value.trim();if(!name)return;localStorage.iplName=name;
  peer=new Peer();
  peer.on('open',()=>{hostConn=peer.connect(room,{reliable:true});
    hostConn.on('open',()=>send({t:'join',name}));
    hostConn.on('data',d=>{if(d.t==='s'){V=d.s;you=d.you;recv=Date.now();render()}});
    hostConn.on('close',()=>{err='Disconnected from host. Refresh to rejoin.';render()})});
  peer.on('error',e=>{err='Could not reach the room ('+e.type+'). Is the host online?';render()})}
function cfg(){send({t:'cfg',purse:$('#pu').value,rtm:$('#rt').value})}
